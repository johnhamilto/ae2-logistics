plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

group = project.mod_group
version = "${project.minecraft_version}-${project.mod_version}"

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://api.modrinth.com/maven")
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // JEI's official maven; Modrinth's maven serves multi-loader versions'
        // primary (Fabric) file, so JEI must come from here with an explicit loader.
        url = uri("https://maven.blamejared.com")
        content { includeGroup "mezz.jei" }
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${project.ae2_version}"
    compileOnly "org.appliedenergistics:guideme:${project.guideme_version}"

    // Dev-environment QoL only; not shipped dependencies.
    runtimeOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly "mezz.jei:jei-1.21.1-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${project.jei_version}"
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
        gametest {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
            systemProperty('ae2logistics.tests', 'true')
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        }
        guide {
            client()
            // Live-reloads guide pages from source while the game runs, and opens
            // our category on startup - edit a page, see it instantly.
            systemProperty('guideDev.ae2guide.sources',
                    file('src/main/resources/assets/ae2logistics/ae2guide').absolutePath)
            systemProperty('guideDev.ae2guide.sourcesNamespace', project.mod_id)
            systemProperty('guideDev.ae2guide.startupPage', 'ae2logistics:ae2logistics-index.md')
        }
    }

    mods {
        ae2logistics {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            version             : version,
            loader_version_range: project.loader_version_range,
            neo_version_range   : project.neo_version_range,
            ae2_version_range   : project.ae2_version_range,
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
