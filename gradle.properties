mod_id=ae2logistics
mod_group=io.github.johnhamilto
mod_version=0.43.0

minecraft_version=26.1.2
neoforge_version=26.1.2.95
ae2_version=26.1.10-beta
guideme_version=26.1.12-beta

loader_version_range=[1,)
neo_version_range=[26.1,)
ae2_version_range=[26.1.0,26.2.0)

# NFRT's downloadAssets pins a Java 21 toolchain while the mod builds on 25;
# Homebrew JDKs are keg-only, so Gradle needs both paths spelled out.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3G

jei_version=29.22.0.73

# Jade and the compat-suite versions return when their 26.1 ports exist -
# main's gradle.properties lists the full 1.21.1 set.
